# Verificacion de `site/` en cada PR y en cada empuje a main.
#
# ═══════════════════════════════════════════════════════════════════════════════
# POR QUE ESTO EXISTE
#
# El repositorio tiene nueve comprobaciones excelentes y hasta ahora no habia CI:
# dependian de que alguien se acordara de ejecutarlas antes de abrir un PR. Los
# tres bloqueantes que se corrigieron el 30/07/2026 -el honeypot desconectado, el
# `delivery: 'sent'` sin envio y un `check:age` que apuntaba a un script
# inexistente- habrian salido aqui, en la primera ejecucion, en lugar de en una
# revision manual.
#
# El orden NO es arbitrario: primero lo que falla en segundos y localiza el
# problema en una linea (lint, typecheck), despues lo que necesita el artefacto
# completo (`check:js`, `test:e2e`), que es lo que tarda. Asi un error de tipos no
# se descubre despues de cinco minutos de build.
# ═══════════════════════════════════════════════════════════════════════════════

name: verificar

on:
  pull_request:
  push:
    branches: [main]

# Un empuje nuevo cancela la ejecucion anterior de la misma rama: revisar el
# resultado de un commit que ya nadie va a mirar solo gasta minutos.
concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Todo vive en site/. No hay workspace en la raiz.
    working-directory: site

jobs:
  comprobaciones:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Corepack respeta el `packageManager` de package.json (pnpm 11.5.0), asi
      # que la version no se declara dos veces.
      - name: Habilitar corepack
        run: corepack enable
        working-directory: .

      - uses: actions/setup-node@v4
        with:
          # Del propio `engines`, para que no pueda divergir de lo que se usa en
          # local ni de `NODE_VERSION` de netlify.toml.
          node-version-file: site/package.json
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # ── Rapido primero: falla en segundos y senala la linea ──
      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Pruebas unitarias
        run: pnpm test

      - name: Paridad de mensajes ES/EN
        run: pnpm check:i18n

      - name: Manifiesto de rutas
        run: pnpm check:routes

      # La regla que impide que las tarifas del modelo acaben en el navegador.
      - name: Arquitectura estatica
        run: pnpm verify:architecture

      # ── A partir de aqui hace falta el artefacto ──
      # `pnpm build` encadena clean, images, content, seo, next build y
      # verify:export. No se llama a `next build` directamente a proposito.
      - name: Build
        run: pnpm build

      - name: Presupuesto de JavaScript
        run: pnpm check:js

      # Solo Chromium: es el unico navegador que la matriz de playwright.config.ts
      # usa. Instalar los tres triplica el tiempo para nada.
      - name: Instalar Chromium para Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Pruebas E2E
        run: pnpm test:e2e

      # Sube el informe solo si algo ha fallado: en verde no lo abre nadie y
      # ocupa espacio de artefactos.
      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 7
