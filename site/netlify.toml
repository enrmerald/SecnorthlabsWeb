# Netlify · sitio estatico + dos funciones de ingestion.
#
# Las paginas se exportan por completo en build y las sirve el CDN. Lo unico que
# ejecuta codigo son las dos funciones de netlify/functions/, que Netlify
# despliega aparte: Next no las compila ni las conoce.

[build]
  base = "site"
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24.18.0"
  PNPM_VERSION = "11.5.0"
  # No es opcional: sin ella el plugin de Next puede intentar montar funciones
  # para SSR y convertir en hibrido lo que queremos estatico.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# ── Rutas de las funciones ───────────────────────────────────────────────────
# El navegador llama a /api/*, del mismo origen: sin CORS y sin preflight.
# No hay `signed =`: el sitio y las funciones estan en el mismo proyecto, asi que
# no hay salto entre sitios que firmar, y la firma JWS de Netlify solo funciona
# proxificando a sitios externos.

[[redirects]]
  from = "/api/quote"
  to = "/.netlify/functions/quote"
  status = 200
  force = true

[[redirects]]
  from = "/api/csp-report"
  to = "/.netlify/functions/csp-report"
  status = 200
  force = true

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

  # Limite en el borde: corta el abuso ANTES de que se invoque la funcion, asi
  # que no gasta ejecuciones ni cuota de Resend.
  #
  # ⚠️ El plan Free admite **2 reglas por proyecto** definidas en codigo (5 en
  # Pro, 100 solo en Enterprise con HP Edge). Esta es la primera; la segunda
  # queda reservada para /api/quote cuando la calculadora vuelva. No se pueden
  # anadir mas sin cambiar de plan.
  #
  # 20 peticiones por minuto y por IP es el valor de MIG-02 §7.2. Es holgado a
  # proposito: detras de una misma IP puede haber una oficina entera con NAT, y
  # un limite estrecho cortaria a personas reales sin decirles por que. Lo que
  # filtra el envio automatizado no es esto, sino el honeypot y la comprobacion
  # de tiempo de la funcion; esto solo pone un techo al volumen.
  #
  # `window_size` admite entre 1 y 180 segundos: un limite de negocio mas largo
  # -«5 solicitudes cada 10 minutos»- no cabe aqui y tendria que aplicarlo la
  # funcion.
  [redirects.rate_limit]
    window_limit = 20
    window_size = 60
    # `["domain"]` a secas es solo de Enterprise. Con ip+domain, el limite se
    # cuenta por visitante, que es lo que se quiere.
    aggregate_by = ["ip", "domain"]

# ── Redirecciones desde la SPA anterior (Fase 7.1) ───────────────────────────
# Las URLs que hoy estan indexadas NO pueden devolver 404. Inventario tomado del
# sitemap.xml y de las rutas de la SPA de web/ antes de borrarla:
#
#   sitemap.xml declaraba:  /  /privacidad  /aviso-legal  /cookies
#   la SPA servia:          /  /politica-privacidad  /aviso-legal  /cookies
#
# Fijate en la discrepancia: se envio a Google /privacidad, que la SPA nunca
# sirvio. Se redirige igualmente, porque puede seguir en su cola de rastreo.
#
# ⚠️ Esto NO sustituye al inventario real de Search Console (pendiente P23). Es
# lo que se puede afirmar con lo que habia en el repositorio; si hay URLs
# indexadas que no estaban en ese sitemap, faltan aqui.
#
# Los destinos van sin prefijo de idioma (decision de Direccion del 11/08/2026,
# ver la seccion de mas abajo): antes eran `/es/...`.

[[redirects]]
  from = "/politica-privacidad"
  to = "/politica-privacidad/"
  status = 301
  force = true

[[redirects]]
  from = "/privacidad"
  to = "/politica-privacidad/"
  status = 301
  force = true

[[redirects]]
  from = "/aviso-legal"
  to = "/aviso-legal/"
  status = 301
  force = true

[[redirects]]
  from = "/cookies"
  to = "/cookies/"
  status = 301
  force = true

# Anclas de la SPA: no generaban URL propia, pero pueden estar enlazadas desde
# fuera con la forma /about, /product o /contact.
[[redirects]]
  from = "/about"
  to = "/compania/"
  status = 301
  force = true

[[redirects]]
  from = "/product"
  to = "/software/"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/contacto/"
  status = 301
  force = true

# ── El contenido vive en la raiz del dominio, en espanol ─────────────────────
#
# Decision de Direccion del 11/08/2026: el publico objetivo es espanol y el
# ingles «no hace falta por ahora», mas un motivo con fecha -Cookiebot en
# version trial escanea 50 paginas, y el sitio con ingles tiene 78; sin el, 37-.
# Se retira con el interruptor `IDIOMAS_ACTIVOS` de `src/config/routes.ts`, no
# borrando nada: `messages/en.json`, los 22 articulos de `content/blog/en/` y
# los `paths.en` del manifiesto se conservan para cuando vuelva.
#
# Hasta ahora la raiz repartia por idioma del navegador con dos 302 (decision de
# Direccion del 29/07/2026). Ese reparto ha desaparecido: `/` es ahora la Home
# real, en espanol, servida por el artefacto sin ninguna regla de por medio.
#
# Lo que queda por hacer es redirigir el legado con prefijo, para que ninguna
# URL indexada de `/es/*` o `/en/*` devuelva 404 (seccion 7.1 de nuevo, aplicada
# esta vez a las 78 URLs que si se llegaron a publicar):
#
#   1. `/es/*` cubre las 37 URLs espanolas de una sola regla: el path sin el
#      prefijo es exactamente la URL nueva.
#   2. `/en/blog/*` cubre el listado y los 22 articulos ingleses: el slug es el
#      mismo en los dos idiomas por contrato de `content:build`.
#   3. Las paginas fijas en ingles no comparten slug con la espanola
#      (`/en/company/` vs `/compania/`), asi que van una a una.
#   4. Cualquier otra URL bajo `/en/` -que no debiera existir, pero por si
#      acaso- cae a la Home en vez de a un 404.

[[redirects]]
  from = "/es/*"
  to = "/:splat"
  status = 301
  force = true

# NINGUNA regla de /en/ lleva `force`, y es deliberado: `force` gana tambien
# cuando el fichero existe, asi que el dia que `IDIOMAS_ACTIVOS` vuelva a
# ['es','en'] estas catorce reglas redirigirian al espanol cada pagina inglesa
# recien construida y el ingles seria inalcanzable -en produccion, con el build,
# check:routes, verify:export y las e2e en verde, porque ninguno prueba la tabla
# de redirecciones contra el artefacto ingles-. Sin `force` solo actuan mientras
# no exista el fichero, que es exactamente lo que hace falta: hoy redirigen el
# legado y manana se apartan solas.
[[redirects]]
  from = "/en/blog/*"
  to = "/blog/:splat"
  status = 301

[[redirects]]
  from = "/en/solutions/mssp/"
  to = "/soluciones/mssp/"
  status = 301

[[redirects]]
  from = "/en/solutions/mssp/it/"
  to = "/soluciones/mssp/it/"
  status = 301

[[redirects]]
  from = "/en/solutions/mssp/ot/"
  to = "/soluciones/mssp/ot/"
  status = 301

[[redirects]]
  from = "/en/solutions/grc/"
  to = "/soluciones/grc/"
  status = 301

[[redirects]]
  from = "/en/solutions/grc/catalogue/"
  to = "/soluciones/grc/catalogo/"
  status = 301

[[redirects]]
  from = "/en/software/"
  to = "/software/"
  status = 301

[[redirects]]
  from = "/en/sectors/"
  to = "/sectores/"
  status = 301

[[redirects]]
  from = "/en/company/"
  to = "/compania/"
  status = 301

[[redirects]]
  from = "/en/contact/"
  to = "/contacto/"
  status = 301

# `/en/calculator/` no redirige a `/calculadora/`: ese destino no se construye
# mientras `CALCULADORA_ACTIVA` sea false, asi que seria un 301 permanente hacia
# un 404, que Search Console reporta como error en vez de como retirada limpia.
# Se le da el mismo trato que a la version espanola, que cae en el `/*` del final:
# un 404 directo. Cuando vuelva la calculadora, esta regla pasa a ser el 301.
[[redirects]]
  from = "/en/calculator/"
  to = "/404/"
  status = 404

[[redirects]]
  from = "/en/privacy-policy/"
  to = "/politica-privacidad/"
  status = 301

[[redirects]]
  from = "/en/legal-notice/"
  to = "/aviso-legal/"
  status = 301

[[redirects]]
  from = "/en/cookies/"
  to = "/cookies/"
  status = 301

# Cierre: cualquier otra URL bajo /en/ -incluida la Home, /en/- que no haya
# casado con ninguna regla de arriba.
[[redirects]]
  from = "/en/*"
  to = "/"
  status = 301

# ── Cabeceras ────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    # Un ano, y con subdominios porque no hay ninguno sirviendo por HTTP.
    #
    # SIN `preload`, y no por olvido: entrar en la lista precargada de los
    # navegadores es practicamente irreversible -se compila dentro de Chrome y
    # Firefox- y obliga a que todo subdominio presente y futuro tenga HTTPS para
    # siempre. Eso es una decision de infraestructura, no una cabecera mas.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Destino de los informes de la CSP de abajo. `report-to` necesita que el
    # nombre del grupo se declare aqui; el `report-uri` clasico apunta a la misma
    # funcion y cubre a los navegadores que aun no implementan la Reporting API.
    Reporting-Endpoints = "csp=\"/api/csp-report\""
    # CSP en modo informe primero. NO se pasa a bloqueo sin medir con trafico
    # real: una CSP escrita de memoria rompe la pagina en silencio.
    #
    # ⚠️ Hasta ahora esto era papel mojado: sin `report-uri` ni `report-to`, el
    # navegador detectaba las violaciones y no las mandaba a ninguna parte, asi que
    # la politica no protegia -es Report-Only- y tampoco informaba. Ya hay sumidero
    # (`netlify/functions/csp-report.ts`) y las dos directivas al final.
    #
    # ANTES DE PASAR A BLOQUEO hay que anadir los hosts de Cookiebot
    # (`consent.cookiebot.com` y `consentcdn.cookiebot.com` en `script-src` y
    # `connect-src`). No se anaden ya porque Cookiebot todavia no esta instalado y
    # una lista blanca con hosts que no se usan es una lista que nadie repasa: los
    # informes diran exactamente cuales hacen falta cuando llegue el momento.
    #
    # `/api/*` es del mismo origen, asi que ahi basta 'self'. Lo que abre la
    # politica es Google Tag Manager y Analytics:
    #
    #   script-src   googletagmanager.com sirve gtm.js, y gtag.js cuando lo pide
    #                el contenedor. El arranque NO va en linea: vive en
    #                /analitica.js. La politica se deja abierta aunque la
    #                analitica este hoy desmontada, para que devolverla sea
    #                descomentar dos lineas del layout y nada mas.
    #                **'unsafe-inline' sigue siendo obligatorio**, pero por Next,
    #                no por GTM: cada pagina exportada lleva un `__next_f.push`
    #                en linea con los datos de hidratacion, y con
    #                `output: 'export'` no hay servidor que genere un nonce por
    #                peticion. Conviene saberlo: con 'unsafe-inline' la CSP deja
    #                de ser una defensa real contra XSS y queda como higiene.
    #   connect-src  las balizas de medicion; GA4 usa varios subdominios segun
    #                la region, de ahi los comodines.
    #   img-src      el pixel de respaldo cuando la baliza no puede salir.
    #   frame-src    el iframe de <noscript> de GTM.
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com; font-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; frame-src https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; report-uri /api/csp-report; report-to csp"

# Activos con hash en el nombre: un ano, inmutables.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# HTML: revalidar siempre, o un despliegue no se ve.
#
# Se enumeran las secciones en vez de poner un `/*`, y no es cautela de mas:
# Netlify aplica TODAS las reglas `[[headers]]` que casan y concatena las
# cabeceras con el mismo nombre, asi que un `/*` casaria tambien con
# `/_next/static/*` y `/logos/*` y esos activos acabarian con un
# `Cache-Control: …immutable, public, max-age=0, must-revalidate` -dos max-age en
# conflicto- que obliga a revalidar: los chunks con hash dejarian de cachearse un
# ano y cada visita recurrente volveria a descargarlos. Cuando el contenido vivia
# bajo `/es/*` y `/en/*` el solapamiento era imposible por construccion.
#
# La lista sale de los paths del manifiesto (`src/config/routes.ts`): una seccion
# nueva ahi necesita su linea aqui.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/blog/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/soluciones/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/software/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sectores/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/compania/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/contacto/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/calculadora/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/politica-privacidad/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/aviso-legal/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/cookies/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/404/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Se mantiene para `/404.html`, que no cuelga de ninguna ruta del manifiesto.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── 404 unica. AL FINAL: Netlify evalua de arriba abajo y una regla comodin por
# encima de una ruta real se la come. ────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/404/"
  status = 404
